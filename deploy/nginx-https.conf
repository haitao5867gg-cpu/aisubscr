server {
    listen 80;
    server_name aisubscr.com www.aisubscr.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/aisubscr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aisubscr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:aisubscrTLS:10m;
    ssl_session_timeout 1d;
    server_name aisubscr.com www.aisubscr.com;
    client_max_body_size 10m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    # Defense in depth for CRON_SECRET routes. Cloudflare and other visitors are denied.
    location ^~ /api/internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # Visitor IP for app rate limits. Include deploy/nginx-cloudflare-realip.conf
        # in this server block so $remote_addr is the client, not a Cloudflare edge.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
