# Trust Cloudflare source addresses and restore the visitor IP into $remote_addr.
# Fetched 2026-11-09 from https://www.cloudflare.com/ips-v4 and /ips-v6.
# Refresh these ranges when Cloudflare publishes changes.
# Include this file from the aisubscr server block, then reload nginx.
# The app rate-limits auth with X-Real-IP (nginx sets it from $remote_addr).
# When that address is still a Cloudflare edge, the app uses CF-Connecting-IP,
# then the rightmost non-proxy X-Forwarded-For hop. Include this file so
# X-Real-IP is the visitor even if CF-Connecting-IP is missing.

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

